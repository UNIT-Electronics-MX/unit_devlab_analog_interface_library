name=DevLab_AnalogInterface
version=1.0.0
author=UNIT Electronics MX
maintainer=Adrian Rabadan, Cesar Bautista, Jonathan Mejorado, Fernando Flores
sentence=Arduino library for the UE0177 Analog-Digital to I2C Sensor Interface using the DevLab Device Protocol (DDP).
paragraph=Reads any analog sensor through the 12-bit ADC of a PY32F003 node over I2C (Device ID 0x0119), exposes a software threshold with hysteresis, and configures the optional PB5 GPIO line as an input, a fixed output or an output that follows the threshold.
category=Sensors
url=https://github.com/UNIT-Electronics-MX/unit_devlab_analog_interface_library
architectures=*
includes=DevLab_AnalogInterface.h
depends=DevLabDDP, DevLab_Interface
